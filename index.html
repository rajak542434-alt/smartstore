<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Affiliate Store - Best Deals</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; margin: 0; padding: 10px; }
        header { background: #333; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .store-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; padding: 15px; text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 5px; }
        .product-title { font-size: 16px; font-weight: bold; margin: 10px 0; color: #333; }
        .product-price { color: #b12704; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { display: block; background: #ffa41c; color: black; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .buy-btn:hover { background: #e69516; }
    </style>
</head>
<body>

    <header>🛒 My Smart Affiliate Store</header>

    <div class="store-container">
        
        <!-- प्रोडक्ट 1 (शुरुआत के लिए उदाहरण) -->
        <div class="product-card">
            <!-- यहाँ अपने प्रोडक्ट की इमेज का लिंक डालें -->
            <img src="https://unsplash.com" alt="Product Image">
            <div class="product-title">Premium Wireless Bluetooth Headphones</div>
            <div class="product-price">₹1,999</div>
            <!-- यहाँ अपना अमेज़न/फ्लिपकार्ट का अफ़िलिएट लिंक डालें -->
            <a href="YOUR_AFFILIATE_LINK_HERE" target="_blank" class="buy-btn">Buy from Amazon</a>
        </div>

    </div>

</body>
</html>
