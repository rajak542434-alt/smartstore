<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Affiliate Store</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; margin: 0; padding: 10px; }
        header { background: #333; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .store-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; padding: 15px; text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 5px; }
        .product-title { font-size: 16px; font-weight: bold; margin: 10px 0; color: #333; height: 40px; overflow: hidden; }
        .product-price { color: #b12704; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { display: block; color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <header>🛒 My Smart Affiliate Store</header>

    <div class="store-container">
        
        <!-- प्रोडक्ट 1: ट्रेंडी कुर्ती (Meesho) -->
        <div class="product-card">
            <img src="https://unsplash.com" alt="Product 1">
            <div class="product-title">Trendy Ethnic Wear Anarkali Kurti</div>
            <div class="product-price">₹499</div>
            <a href="YOUR_MEESHO_LINK_1" target="_blank" class="buy-btn" style="background: #f43397;">Buy from Meesho</a>
        </div>

        <!-- Produkt 2: मेन्स शर्ट (Flipkart) -->
        <div class="product-card">
            <img src="https://unsplash.com" alt="Product 2">
            <div class="product-title">Waterproof Men's Hair Trimmer</div>
            <div class="product-price">₹799</div>
            <a href="YOUR_FLIPKART_LINK_1" target="_blank" class="buy-btn" style="background: #2874f0;">Buy from Flipkart</a>
        </div>

    </div>

</body>
</html>
