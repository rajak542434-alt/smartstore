<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Reselling Store</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; margin: 0; padding: 10px; }
        header { background: #333; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .store-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 5px; }
        .product-title { font-size: 16px; font-weight: bold; margin: 10px 0; color: #333; min-height: 40px; }
        .product-price { color: #b12704; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .buy-btn { display: block; color: white; text-decoration: none; padding: 12px; border-radius: 5px; font-weight: bold; font-size: 14px; background: #ff9900; border: none; width: 100%; cursor: pointer; }
        #loading { text-align: center; font-size: 18px; color: #666; margin-top: 50px; }
        
        /* Form Popup Styling */
        .order-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .form-container { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .form-container h2 { margin-top: 0; font-size: 18px; color: #333; }
        .form-container input, .form-container textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .close-btn { background: #dc3545; color: white; border: none; padding: 8px; margin-top: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>🛒 My Smart Reselling Store</header>

    <div id="loading">दुकान सज रही है, कृपया रुकें (Loading Products)...</div>
    <div class="store-container" id="products-grid"></div>

    <!-- Order Form Popup -->
    <div id="orderModal" class="order-modal">
        <div class="form-container">
            <h2 id="form-product-title">Order Details</h2>
            <input type="text" id="custName" placeholder="आपका पूरा नाम (Your Name)" required>
            <input type="tel" id="custPhone" placeholder="मोबाइल नंबर (Mobile Number)" required>
            <textarea id="custAddress" placeholder="पूरा पता: मकान नंबर, गली, शहर, पिनकोड (Full Address with Pincode)" rows="4" required></textarea>
            <button class="submit-btn" onclick="sendOrder()">Confirm Order (WhatsApp COD)</button>
            <button class="close-btn" onclick="closeOrderForm()">Cancel</button>
        </div>
    </div>

    <script>
        const MY_WHATSAPP = "916205472606"; 
        const SHEET_ID = '1ztj34lWtk1Kjmv9A8wlkZk9DNFIRGSXx-C1kYEBByRw'; 
        const SHEET_TITLE = 'Sheet1'; 
        
        const url = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_TITLE}`;

        var selectedProduct = "";
        var selectedPrice = "";

        fetch(url)
            .then(res => res.text())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const grid = document.getElementById('products-grid');
                
                // गूगल शीट का डेटा साफ़ तरीके से लोड करने के लिए
                const lines = data.split('\n');
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const columns = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.length >= 3) {
                        const title = columns[0].replace(/^"|"$/g, '').trim();
                        const price = columns[1].replace(/^"|"$/g, '').trim();
                        const image = columns[2].replace(/^"|"$/g, '').trim();

                        if(title !== "" && title !== "title") {
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.innerHTML = `
                                <img src="${image}" alt="${title}">
                                <div class="product-title">${title}</div>
                                <div class="product-price">Price: ₹${price}</div>
                                <button class="buy-btn" onclick="openOrderForm('${title.replace(/'/g, "\\'")}', '₹${price}')">Buy Now (Cash on Delivery)</button>
                            `;
                            grid.appendChild(card);
                        }
                    }
                }
            })
            .catch(err => {
                document.getElementById('loading').innerText = 'Products load होने में समस्या आई।';
            });

        function openOrderForm(title, price) {
            selectedProduct = title;
            selectedPrice = price;
            document.getElementById("form-product-title").innerText = "Order: " + title + " (" + price + ")";
            document.getElementById("orderModal").style.display = "flex";
        }

        function closeOrderForm() {
            document.getElementById("orderModal").style.display = "none";
        }

        function sendOrder() {
            var name = document.getElementById("custName").value;
            var phone = document.getElementById("custPhone").value;
            var address = document.getElementById("custAddress").value;

            if(name.trim() === "" || phone.trim() === "" || address.trim() === "") {
                alert("कृपया सभी जानकारी सही से भरें!");
                return;
            }

            var message = "🚨 *NEW RESELLING ORDER* 🚨\n\n" +
                          "📦 *Product:* " + selectedProduct + "\n" +
                          "💰 *Price:* " + selectedPrice + "\n\n" +
                          "👤 *Customer Name:* " + name + "\n" +
                          "📞 *Phone:* " + phone + "\n" +
                          "📍 *Address:* " + address + "\n\n" +
                          "Please book this order on Cash on Delivery.";

            var whatsappUrl = "https://whatsapp.com" + MY_WHATSAPP + "&text=" + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
            closeOrderForm();
        }
    </script>
</body>
</html>
